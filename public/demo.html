<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sunani Web Host</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script type="module">
    // ========== Sunani codes (match your Go enums) ==========
    const Action = { Unknown: 0, Press: 1, Release: 2 };

    // Key enum: KeyUnknown=0, KeyA=1...KeyZ=26, Key0=27...Key9=36, etc
    // (Your order is fixed, so we encode numbers directly.)
    const Key = {
      Unknown: 0,
      A: 1, B: 2, C: 3, D: 4, E: 5, F: 6, G: 7, H: 8, I: 9, J: 10,
      K: 11, L: 12, M: 13, N: 14, O: 15, P: 16, Q: 17, R: 18, S: 19, T: 20,
      U: 21, V: 22, W: 23, X: 24, Y: 25, Z: 26,

      _0: 27, _1: 28, _2: 29, _3: 30, _4: 31, _5: 32, _6: 33, _7: 34, _8: 35, _9: 36,

      Escape: 37,
      Enter: 38,
      Space: 39,
      Tab: 40,
      Backspace: 41,

      Up: 42,
      Down: 43,
      Left: 44,
      Right: 45,
    };

    const Mouse = { Unknown: 0, Left: 1, Right: 2, Middle: 3 };

    // KeyboardEvent.code -> Sunani Key
    const keyFromCode = (code) => {
      // Letters: "KeyA".."KeyZ"
      if (code.startsWith("Key") && code.length === 4) {
        const ch = code[3];
        const idx = ch.charCodeAt(0) - 65; // 'A'
        if (0 <= idx && idx < 26) return Key[ch];
      }

      // Digits: "Digit0".."Digit9"
      if (code.startsWith("Digit") && code.length === 6) {
        const d = code[5];
        if ("0" <= d && d <= "9") return Key["_" + d];
      }

      switch (code) {
        case "Escape": return Key.Escape;
        case "Enter": return Key.Enter;
        case "Space": return Key.Space;
        case "Tab": return Key.Tab;
        case "Backspace": return Key.Backspace;
        case "ArrowUp": return Key.Up;
        case "ArrowDown": return Key.Down;
        case "ArrowLeft": return Key.Left;
        case "ArrowRight": return Key.Right;
        default: return Key.Unknown;
      }
    };

    const mouseFromButton = (button) => {
      // JS: 0=left,1=middle,2=right
      switch (button) {
        case 0: return Mouse.Left;
        case 1: return Mouse.Middle;
        case 2: return Mouse.Right;
        default: return Mouse.Unknown;
      }
    };

    // ========== Canvas / FB host ==========
    const canvasEl = document.getElementById("c");
    const ctx2d = canvasEl.getContext("2d", { alpha: true });

    const fbOffscreen = document.createElement("canvas");
    const fbOffCtx = fbOffscreen.getContext("2d", { alpha: true });

    let wasm = null;
    let running = true;

    // memory view (refresh after growth)
    let memU8 = null;
    const refreshMem = () => {
      const mem = wasm.exports.memory;
      memU8 = new Uint8Array(mem.buffer);
    };

    // HiDPI resize
    const resize = () => {
      const dpr = window.devicePixelRatio || 1;
      const w = Math.max(1, Math.floor(canvasEl.clientWidth * dpr));
      const h = Math.max(1, Math.floor(canvasEl.clientHeight * dpr));
      if (canvasEl.width !== w || canvasEl.height !== h) {
        canvasEl.width = w;
        canvasEl.height = h;
      }
    };
    window.addEventListener("resize", resize);
    resize();

    // immediate-mode draw state
    let currentColor = "rgba(255,255,255,1)";

    // framebuffer state
    let fbPtr = 0;
    let fbW = 0;
    let fbH = 0;
    let fbImageData = null;

    const importObject = {
      sunani: {
        // ---- system ----
        "system.halt": () => { running = false; },

        // ---- canvas ----
        "canvas.begin": () => {
          // do nothing currently
        },
        "canvas.clear": (r, g, b, a) => {
          ctx2d.save();
          ctx2d.setTransform(1, 0, 0, 1, 0, 0);
          ctx2d.fillStyle = `rgba(${(r*255)|0},${(g*255)|0},${(b*255)|0},${a})`;
          ctx2d.fillRect(0, 0, canvasEl.width, canvasEl.height);
          ctx2d.restore();
        },
        "canvas.color": (r, g, b, a) => {
          currentColor = `rgba(${(r*255)|0},${(g*255)|0},${(b*255)|0},${a})`;
          ctx2d.strokeStyle = currentColor;
          ctx2d.fillStyle = currentColor;
        },
        "canvas.line": (x1, y1, x2, y2) => {
          ctx2d.beginPath();
          ctx2d.moveTo(x1, y1);
          ctx2d.lineTo(x2, y2);
          ctx2d.stroke();
        },
        "canvas.rect": (x, y, w, h) => {
          ctx2d.strokeRect(x, y, w, h);
        },
        "canvas.fill_rect": (x, y, w, h) => {
          ctx2d.fillRect(x, y, w, h);
        },
        "canvas.path": (x, y) => {
          ctx2d.beginPath();
          ctx2d.moveTo(x, y);
        },
        "canvas.vertex": (x, y) => {
          ctx2d.lineTo(x, y);
        },
        "canvas.polygon": () => {
          ctx2d.closePath();
          ctx2d.stroke();
        },
        "canvas.fill_polygon": () => {
          ctx2d.closePath();
          ctx2d.fill();
        },

        // ---- fb ----
        "fb.params": (ptr, width, height) => {
          fbPtr = ptr >>> 0;
          fbW = width >>> 0;
          fbH = height >>> 0;

          // Canvas ImageData buffer (clamped RGBA)
          fbImageData = new ImageData(fbW, fbH);
        },
        "fb.paint": () => {
          if (!fbPtr || !fbW || !fbH || !fbImageData) return;

          refreshMem();

          const len = fbW * fbH * 4;
          const src = memU8.subarray(fbPtr, fbPtr + len);
          fbImageData.data.set(src);

          // Begin() in Go
          const cw = canvasEl.width;
          const ch = canvasEl.height;

          const scale = Math.floor(Math.min(cw / fbW, ch / fbH));
          const dw = fbW * scale;
          const dh = fbH * scale;

          const ox = Math.floor((cw - dw) * 0.5);
          const oy = Math.floor((ch - dh) * 0.5);

          // ImageData -> offscreen canvas -> magnified draw
          fbOffscreen.width = fbW;
          fbOffscreen.height = fbH;
          fbOffCtx.putImageData(fbImageData, 0, 0);

          ctx2d.imageSmoothingEnabled = false; // crisp pixel
          ctx2d.drawImage(
            fbOffscreen,
            0, 0, fbW, fbH,
            ox, oy, dw, dh
          );
        },
      }
    };

    // ========== load wasm ==========
    const wasmUrl = "./demo.wasm";
    const bytes = await (await fetch(wasmUrl)).arrayBuffer();
    const { instance } = await WebAssembly.instantiate(bytes, importObject);
    wasm = instance;
    refreshMem();

    const call = (name, ...args) => {
      const fn = wasm.exports[name];
      if (typeof fn === "function") return fn(...args);
    };

    // init exports (call if exists)
    call("sunani_system_init");
    call("sunani_canvas_init");
    call("sunani_fb_init");
    call("sunani_key_init");
    call("sunani_mouse_init");

    // ========== input wiring ==========
    window.addEventListener("keydown", (e) => {
      if (e.repeat) return;
      const k = keyFromCode(e.code);
      call("sunani_key_event", k, Action.Press);
    });
    window.addEventListener("keyup", (e) => {
      const k = keyFromCode(e.code);
      call("sunani_key_event", k, Action.Release);
    });

    // add pointer lock or capture if needed
    canvasEl.addEventListener("mousemove", (e) => {
      const rect = canvasEl.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const x = (e.clientX - rect.left) * dpr;
      const y = (e.clientY - rect.top) * dpr;
      call("sunani_mouse_motion", x, y);
    });

    canvasEl.addEventListener("mousedown", (e) => {
      canvasEl.focus?.();
      const b = mouseFromButton(e.button);
      call("sunani_mouse_button", b, Action.Press);
    });
    canvasEl.addEventListener("mouseup", (e) => {
      const b = mouseFromButton(e.button);
      call("sunani_mouse_button", b, Action.Release);
    });
    canvasEl.addEventListener("contextmenu", (e) => {
      e.preventDefault();
    });

    canvasEl.addEventListener("wheel", (e) => {
      e.preventDefault();
      // GLFW-like
      const xoff = e.deltaX / 128;
      const yoff = -e.deltaY / 128;
      call("sunani_mouse_wheel", xoff, yoff);
    }, { passive: false });

    // ========== main loop ==========
    function frame() {
      if (!running) return;
      resize();
      call("sunani_system_frame");
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
